overrides:
  hono: '4.13.9'
  postcss: '8.5.23'
  nanoid: '^3.3.17'
  'postcss>nanoid': '^3.3.17'
  '@fastify/static': '10.1.2'
  '@hono/node-server': '2.0.12'
  brace-expansion: '5.0.9'
  fast-uri: '3.1.8'
  js-yaml: '5.2.2'
  react-router: '8.3.0'
  uuid: '11.1.1'
  valibot: '1.4.2'
  smol-toml: '1.9.0'
  vitest: '4.1.11'
  '@vitest/mocker': '4.1.11'
  'deepmerge-ts': '8.0.2'

packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@prisma/engines'
  - 'esbuild'
  - 'prisma'
  - 'msgpackr-extract'

catalog:
  # Runtime Frameworks & UI
  react: 19.2.7
  react-dom: 19.2.7
  lucide-react: 1.8.0
  zod: 4.4.3
  fastify: 5.12.5
  '@fastify/cors': 11.3.0
  '@fastify/helmet': 13.0.2
  '@fastify/sensible': 6.0.4
  '@fastify/swagger': 9.7.0
  '@fastify/swagger-ui': 6.1.0
  '@fastify/rate-limit': 11.1.0
  fastify-plugin: 6.0.0

  # Queues & Message Broker
  bullmq: 5.69.0
  '@bull-board/api': 6.16.0
  '@bull-board/fastify': 6.16.0

  # Database & State
  '@prisma/client': 7.6.0
  prisma: 7.6.0
  '@prisma/adapter-pg': 7.6.0
  pg: 8.21.0
  ioredis: 5.9.2

  # Data Fetching & UI Helpers
  '@tanstack/react-query': 5.99.2
  clsx: 2.1.1
  tailwind-merge: 3.5.0
  tailwindcss: 4.2.2
  '@tailwindcss/vite': 4.2.2
  sonner: 2.0.5

  # i18n

  # Utilities
  pino: 10.3.1
  pino-pretty: 13.1.3

  # Dev Tooling & Benchmarks
  autocannon: 8.0.0
  '@types/autocannon': 7.12.6
  typescript: 7.0.2
  '@types/node': 25.9.3
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  '@types/pg': 8.20.0
  vite: 8.0.16
  '@vitejs/plugin-react': 6.0.1
  tsx: 4.23.1
  vitest: 4.1.11
  '@vitest/coverage-v8': 4.1.11
  turbo: 2.9.16
  oxlint: 1.75.0
  oxfmt: 0.60.0
  husky: 9.1.7
  lint-staged: 17.0.7
  knip: 6.16.1
  '@commitlint/cli': 21.0.2
  '@commitlint/config-conventional': 21.0.2

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

minimumReleaseAgeExclude:
  - hono@4.13.9
