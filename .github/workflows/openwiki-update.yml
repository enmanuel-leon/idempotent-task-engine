name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          filter: blob:none

      - name: Check for changes since the last docs update
        id: changes
        run: |
          baseline=$(git log -1 --format=%H -- openwiki)
          if [ -z "$baseline" ]; then
            echo 'No docs commit yet — running initial generation.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$baseline"..HEAD -- . \
            ':(exclude)openwiki' ':(exclude)AGENTS.md' ':(exclude)CLAUDE.md')

          if [ -z "$files" ]; then
            echo "Nothing has changed since $baseline — skipping OpenWiki run."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed since $baseline:"
          echo "$files"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/79004233678/locations/global/workloadIdentityPools/pool-github-actions-cicd/providers/provider-github-actions-cicd'
          service_account: 'sa-github-actions-cicd@entropy-workbench.iam.gserviceaccount.com'

      - name: Run OpenWiki
        run: pnpm --allow-build=better-sqlite3 dlx openwiki@0.3.1 code --update --print
        env:
          OPENWIKI_PROVIDER: gemini-enterprise
          GOOGLE_CLOUD_PROJECT: entropy-workbench
          OPENWIKI_MODEL_ID: gemini-3.6-flash

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          base: develop
          commit-message: 'docs: update OpenWiki'
          title: 'docs: update OpenWiki'
          body: |
            Automated OpenWiki documentation update.
            Generated by scheduled OpenWiki workflow.
