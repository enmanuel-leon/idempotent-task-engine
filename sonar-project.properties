# SonarQube self-hosted configuration for idempotent-task-engine
sonar.projectKey=idempotent-task-engine
sonar.projectName=Idempotent Task Engine
sonar.projectVersion=1.0.0
sonar.host.url=http://192.168.1.136:9000

# Monorepo source directories and test directories
sonar.sources=apps/api/src,apps/api/benchmarks,apps/api/scripts,apps/api/prisma,apps/web/src
sonar.tests=apps/api/tests,apps/web/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# JavaScript / TypeScript LCOV coverage report paths
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info

# General exclusions (excluded from analysis entirely)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,apps/api/prisma/migrations/**,scripts/**,**/*.config.ts,**/*.config.js,**/*.config.mjs

# Coverage exclusions (excluded from coverage calculation metrics: pure JSX views, tests, configs, migrations, benchmarks, seeds)
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,apps/api/tests/**,apps/web/tests/**,apps/api/prisma/**,apps/api/benchmarks/**,apps/api/scripts/**,**/*.config.ts,**/constants/**,apps/api/src/server.ts,apps/web/src/main.tsx,apps/api/src/config/logger.ts,apps/web/src/**/*.tsx,apps/web/src/locales/**

sonar.sourceEncoding=UTF-8
