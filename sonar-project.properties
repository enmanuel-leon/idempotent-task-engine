# SonarQube self-hosted configuration for monorepo-template
sonar.projectKey=monorepo-template
sonar.projectName=monorepo-template
sonar.projectVersion=1.0.0
sonar.host.url=http://192.168.1.136:9000

# Monorepo source directories and test directories
sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/tests,apps/web/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# JavaScript / TypeScript LCOV coverage report paths
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info

# General exclusions (excluded from analysis entirely)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,apps/api/prisma/migrations/**,scripts/**

# Coverage exclusions (excluded from coverage calculation metrics: pure JSX views, tests, configs, migrations)
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,apps/api/tests/**,apps/web/tests/**,apps/api/prisma/**,**/*.config.ts,**/constants/**,apps/api/src/server.ts,apps/web/src/main.tsx,apps/api/src/config/logger.ts,apps/api/scripts/**,apps/web/src/**/*.tsx,apps/web/src/locales/**

sonar.sourceEncoding=UTF-8
