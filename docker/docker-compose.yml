services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: idempotent-task-engine-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_template_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_template_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: idempotent-task-engine-redis-prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: idempotent-task-engine-api
    restart: unless-stopped
    ports:
      - '3100:3100'
    environment:
      NODE_ENV: production
      PORT: 3100
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_template_db?schema=task_engine
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/worker.js']
    container_name: idempotent-task-engine-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_template_db?schema=task_engine
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: idempotent-task-engine-web
    restart: unless-stopped
    ports:
      - '5180:8080'
    depends_on:
      - api

volumes:
  postgres_prod_data:
  redis_prod_data:
